name: Deploy — Dev (sipho-f5a01)

on:
  push:
    branches:
      - develop

jobs:
  deploy-dev:
    name: Build & Deploy to dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generation
        working-directory: app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # google-services.json is git-ignored; the Android module reads it from android/app/.
      - name: Write google-services.json (dev)
        working-directory: app
        env:
          GOOGLE_SERVICES_JSON_DEV: ${{ secrets.GOOGLE_SERVICES_JSON_DEV }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_DEV" | base64 --decode > android/app/google-services.json

      - name: Build Android APK (dev)
        working-directory: app
        run: flutter build apk --target lib/main_dev.dart --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Deploy Firestore Rules & Indexes
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore,functions --project "$FIREBASE_PROJECT_DEV"
        env:
          FIREBASE_PROJECT_DEV: sipho-f5a01
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_DEV }}
