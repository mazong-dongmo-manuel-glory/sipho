name: Deploy — Production (sipho-f5a01)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Build & Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generation
        working-directory: app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Write google-services.json (prod)
        working-directory: app
        env:
          GOOGLE_SERVICES_JSON_PROD: ${{ secrets.GOOGLE_SERVICES_JSON_PROD }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_PROD" ]; then
            echo "$GOOGLE_SERVICES_JSON_PROD" | base64 --decode > android/app/google-services.json
          fi

      - name: Build Android App Bundle (prod)
        working-directory: app
        run: flutter build appbundle --target lib/main_prod.dart --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Deploy Firestore, Storage & Functions (prod)
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore,storage,functions --project "${FIREBASE_PROJECT_PROD:-sipho-f5a01}"
        env:
          FIREBASE_PROJECT_PROD: ${{ secrets.FIREBASE_PROJECT_PROD }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_PROD }}
