name: Deploy — Staging (sipho-staging)

# Same Firebase project as develop: project id `sipho-staging` (console « sipho-dev »)
on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Build & Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run code generation
        working-directory: app
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Write google-services.json (staging)
        working-directory: app
        env:
          GOOGLE_SERVICES_JSON_STAGING: ${{ secrets.GOOGLE_SERVICES_JSON_STAGING }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_STAGING" ]; then
            echo "$GOOGLE_SERVICES_JSON_STAGING" | base64 --decode > android/app/google-services.json
          fi

      - name: Build Android APK (staging)
        working-directory: app
        run: flutter build apk --target lib/main_staging.dart --release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Deploy Firestore, Storage & Functions (staging)
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore,storage,functions --project "${FIREBASE_PROJECT_STAGING:-sipho-staging}"
        env:
          FIREBASE_PROJECT_STAGING: ${{ secrets.FIREBASE_PROJECT_STAGING }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN_STAGING }}
