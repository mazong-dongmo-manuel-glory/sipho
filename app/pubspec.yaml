name: sipho
description: "Sipho — Le Duolingo de l'argent"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  cloud_functions: ^5.1.3
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  firebase_ai: ^2.3.0
  firebase_app_check: ^0.3.1+3
  firebase_remote_config: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_performance: ^0.10.0+8

  # State & Navigation
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.3.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Animations & Media
  lottie: ^3.1.2
  rive: ^0.13.14
  fl_chart: ^0.69.0

  # Audio
  flutter_soloud: ^3.2.1
  audio_session: ^0.1.21

  # Utilities
  image_picker: ^1.1.2
  image: ^4.2.0
  app_links: ^6.3.3
  share_plus: ^10.0.3
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.20.3
  in_app_purchase: ^3.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  timezone: ^0.10.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/animations/
    - assets/rive/
    - assets/sounds/
    - assets/images/
    - assets/images/flags/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
